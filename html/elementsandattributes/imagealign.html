<!DOCTYPE html>
<html>
    <head>
        <title>
            image alignment
        </title>
    </head>
    <body>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR21PHOhKqZ6-MAbRDBW0z9pvv5g5eu_Sky1Q&s"
        width="500px"
        height="500px"
        alt="krishna image"
        title="krishna image"
        align="right">
        <hr size="30px"
        color="black">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR21PHOhKqZ6-MAbRDBW0z9pvv5g5eu_Sky1Q&s"
        width="500px"
        height="500px"
        align="left">
        <hr size="30px"
        color="black">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR21PHOhKqZ6-MAbRDBW0z9pvv5g5eu_Sky1Q&s"
        width="500px"
        height="500px"
        align="centre">
        <hr size="30px"
        color="black">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR21PHOhKqZ6-MAbRDBW0z9pvv5g5eu_Sky1Q&s"
        width="100px"
        height="100px"
        align="left-top">

    </body>
</html>
