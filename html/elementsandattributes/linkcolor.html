<!DOCTYPE html>
<html>
    <head>
        <title>link color</title>
        <style>
            a:link{
                color: red;
            }
            a:visited{
                color: blue;
            }
            a:active{
                color: yellow;
            }
            a:hover{
                color: darkorchid;
            }
        </style>
    </head>
    <body>
        <h4>visited link</h4>
        <a href="https://www.geeksforgeeks.org">greeks for greeks</a>
        <h4> active link</h4>
        <a href="https://facebook.com">greeks for greeks</a>
        <h4>hover effect</h4>
        <a href="https://www.geeksforgeeks.org">greeks for greeks</a>
    </body>
</html>
