<!DOCTYPE html>
<html>
    <head>
        <title>
            style attributes
        </title>
        <body>
            <h2 style="font-family: Chaparral Pro Light;">
                hello every one
            </h2>
            <h2 style="font-size: 30px;">

    </head>
