<!DOCTYPE html>
<html>
    <head>
        <title>
            using target
        </title>

    </head>
    <body>
        <h2>using blank(open diff tab)</h2>
        <a href="https://www.geeksforgeeks.org" target="_blank">greeks for greeks</a>
        <h2>using self (open in same window)</h2>
        <a href="https://www.geeksforgeeks.org" target="_self">greeks for greeks</a>
        <h2>using top (open in full body of window)</h2>
        <a href="https://www.geeksforgeeks.org" target="_top">greeks for greeks</a>
        <h2>using parent(wil open in parent frame)</h2>
        <a href="https://www.geeksforgeeks.org" target="_parent">greeks for greeks</a>

    </body>
</html>
